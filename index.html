<title>آموزش برنامه‌نویسی با AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
body{font-family:Tahoma,sans-serif;background:#fff;min-height:100vh;padding:20px;direction:rtl;overflow-x:hidden}
.box{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{padding:22px 12px;background:#f7f8fa;border:2px solid #eaeaea;border-radius:14px;text-align:center;cursor:pointer;font-weight:bold;transition:transform .15s,border-color .15s}
.card:hover{border-color:#667eea;transform:translateY(-3px)}
.card.active{background:#667eea;border-color:#667eea;color:#fff;box-shadow:0 10px 25px rgba(102,126,234,.35)}
.card .ico{font-size:34px;display:block;margin-bottom:8px}
.card .name{font-size:15px}
.topic{padding:14px 18px;background:#f7f8fa;border-right:4px solid #667eea;border-radius:10px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.topic:hover{background:#eef2ff}
.tag{background:#667eea;color:#fff;padding:3px 12px;border-radius:20px;font-size:12px;white-space:nowrap;flex-shrink:0}
.tag.easy{background:#27ae60}.tag.med{background:#f39c12}.tag.hard{background:#e74c3c}
button.btn{padding:11px 20px;border:none;border-radius:10px;background:#667eea;color:#fff;font-family:Tahoma;font-size:14px;cursor:pointer;font-weight:bold;margin:5px}
button.btn:hover{background:#5568d3}
button.btn.gray{background:#eee;color:#333}
.editor-btn{background:#27ae60;width:100%;margin:0 0 10px 0;padding:13px;font-size:14px}
.editor-btn:hover{background:#219a52}
#res{position:fixed;inset:0;background:#fff;z-index:100;overflow-y:auto;-webkit-overflow-scrolling:touch}
.result-header{position:sticky;top:0;background:#fff;border-bottom:2px solid #eaeaea;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px;z-index:10}
.back-btn{padding:10px 20px;background:#667eea;color:#fff;border:none;border-radius:10px;font-family:Tahoma;font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap;flex-shrink:0}
.back-btn:hover{background:#5568d3}
.topic-title-bar{font-size:16px;font-weight:bold;color:#333;text-align:left;flex:1;padding-left:10px;overflow:hidden}
.topic-title-bar small{color:#999;font-weight:normal;font-size:12px;display:block;margin-bottom:2px}
.topic-title-bar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-body{padding:25px;max-width:1400px;margin:0 auto}
#out{line-height:2;font-size:15px}
#out h2{color:#667eea;font-size:18px;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid #eaeaea}
#out h3{color:#764ba2;font-size:16px;margin:12px 0 6px}
#out p{margin-bottom:8px;line-height:1.9}
#out pre{background:#1e1e1e;color:#d4d4d4;padding:15px;border-radius:8px;direction:ltr;text-align:left;font-size:13px;line-height:1.7;margin:10px 0;font-family:'Courier New',Consolas,monospace;overflow-x:auto;white-space:pre}
#out code{background:#2d2d2d;color:#4ec9b0;padding:2px 6px;border-radius:4px;font-family:monospace;direction:ltr;display:inline-block}
.cursor{display:inline-block;width:8px;height:16px;background:#667eea;vertical-align:middle;margin-right:2px;animation:blink .8s infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.actions-wrap{display:flex;gap:10px;justify-content:flex-start;margin-top:25px;padding:20px 0;border-top:1px solid #eaeaea;flex-wrap:wrap}
.actions-wrap.hide{display:none!important}
.btn-act{padding:11px 18px;border:none;border-radius:10px;background:#667eea;color:#fff;font-family:Tahoma;font-size:14px;font-weight:bold;cursor:pointer}
.btn-act.quiz{background:#f39c12}
.load{text-align:center;padding:40px;color:#667eea;font-weight:bold;font-size:16px}
.load::after{content:'...';animation:d 1.2s infinite}
@keyframes d{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
.err{background:#fff5f5;border-right:4px solid #e74c3c;color:#e74c3c;padding:20px;border-radius:10px}
.hide{display:none!important}
.topics-title{font-size:16px;color:#333;margin:15px 0}
#quiz{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:15px}
#quiz.hide{display:none}
.quiz-box{background:#fff;border-radius:16px;padding:22px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;position:relative}
.quiz-close{position:absolute;top:12px;left:12px;background:#eee;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:#333;font-family:Tahoma;line-height:1}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #eaeaea;font-weight:bold;color:#333;font-size:14px;padding-left:40px}
.quiz-header .score{color:#667eea}
#quizQuestion{font-size:16px;line-height:1.9;margin-bottom:18px;color:#222;min-height:60px}
.quiz-opt{display:block;width:100%;padding:14px 18px;margin-bottom:10px;border:2px solid #e0e0e0;border-radius:10px;background:#f7f8fa;font-family:Tahoma;font-size:15px;text-align:right;cursor:pointer;color:#333}
.quiz-opt:hover:not(:disabled){border-color:#667eea;background:#eef2ff}
.quiz-opt.correct{background:#d4edda;border-color:#27ae60;color:#155724}
.quiz-opt.wrong{background:#f8d7da;border-color:#e74c3c;color:#721c24}
.quiz-actions{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#editor{position:fixed;inset:0;background:#fff;z-index:300;display:flex;flex-direction:column}
.ed-header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:#fff;border-bottom:2px solid #eaeaea;gap:10px}
.ed-run{background:#27ae60;color:#fff;border:none;padding:9px 16px;border-radius:9px;font-family:Tahoma;font-size:13px;font-weight:bold;cursor:pointer}
.ed-run:hover{background:#219a52}
.ed-run:disabled{background:#aaa;cursor:wait}
.ed-ai{display:flex;gap:8px;padding:10px 15px;background:#f7f8fa;border-bottom:1px solid #eaeaea}
.ed-ai input{flex:1;padding:10px 14px;border:2px solid #e0e0e0;border-radius:9px;font-family:Tahoma;font-size:13px;outline:none;background:#fff;color:#333;min-width:0}
.ed-ai input:focus{border-color:#667eea}
.ed-ai button{padding:10px 16px;background:#667eea;color:#fff;border:none;border-radius:9px;font-family:Tahoma;font-size:13px;font-weight:bold;cursor:pointer}
.ed-ai button:disabled{background:#aaa;cursor:wait}
.ed-body{flex:1;display:flex;overflow:hidden;min-height:0;position:relative}
#edCode{flex:1;padding:15px;border:none;font-family:'Courier New',Consolas,monospace;font-size:13px;line-height:1.6;direction:ltr;text-align:left;resize:none;outline:none;background:#fafafa;color:#222;tab-size:4}
#edOutput{position:fixed;inset:0;background:#fff;z-index:400;display:flex;flex-direction:column}
#edOutput.hide{display:none}
.out-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;background:#fff;border-bottom:2px solid #eaeaea}
.out-title{font-weight:bold;color:#333;font-size:15px;flex:1;text-align:center}
.out-exit{background:#e74c3c;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-family:Tahoma;font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap}
.out-exit:hover{background:#c0392b}
#edPreview{flex:1;border:none;background:#fff;width:100%}
.sug-box{position:fixed;background:#fff;border:1px solid #d8dbe6;border-radius:10px;box-shadow:0 8px 24px rgba(60,70,120,.22);max-height:210px;overflow-y:auto;z-index:500;min-width:200px;max-width:300px;font-family:Tahoma;padding:4px 0}
.sug-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:7px 12px;border:none;background:transparent;font-family:Tahoma;font-size:12px;cursor:pointer;direction:ltr;color:#333;text-align:left}
.sug-item:hover,.sug-item.active{background:#dde6ff}
.sug-code{font-family:'Courier New',Consolas,monospace;color:#667eea;font-weight:bold;font-size:13px}
.sug-desc{color:#95a0b8;font-size:10px;white-space:nowrap;direction:rtl}
@media(max-width:600px){body{padding:10px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:16px 8px}.result-body{padding:15px}}
</style>
</head>

// ============================================================
// آموزش با AI - Streaming + Markdown همون لحظه
// ============================================================
async function ask(again){
  const out=document.getElementById("out"),actions=document.getElementById("actionsWrap");
  const isAgain=again===true;
  actions.classList.add("hide");
  const p=isAgain
    ?`موضوع "${CT.t}" از ${CL.n} رو ساده و سریع توضیح بده. از مثال روزمره استفاده کن. کوتاه و مفید.`
    :`موضوع "${CT.t}" از ${CL.n} رو سریع و کوتاه آموزش بده.\n## توضیح ساده\n## نمونه کد\n\`\`\`\n[کد]\n\`\`\`\n## نکته طلایی\nکوتاه، فارسی.`;

  out.className="";
  out.innerHTML='<div class="load">در حال آموزش '+CT.t+'</div>';
  document.getElementById("res").scrollTop=0;

  let fullText="";
  let started=false;

  try{
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [{ role: "user", content: p }],
        temperature: 0.3,
        max_tokens: isAgain ? 600 : 900,
        model: "gpt-4o-mini",
        fingerprint: BROWSER_FP,
        request_type: isAgain ? "ask_again" : "ask",
        language: CL ? CL.id : "",
        topic: CT ? CT.t : "",
        client_token: CLIENT_TOKEN,
        stream: true
      })
    });

    if(res.status === 429){
      const err = await res.json();
      const e2 = new Error(err.error || "تعداد درخواست‌ها زیاد است");
      e2.isRateLimit = true;
      e2.remaining_minutes = err.remaining_minutes || 10;
      throw e2;
    }
    if(!res.ok){
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "خطا در ارتباط با سرور");
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while(true){
      const { done, value } = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for(const line of lines){
        if(!line.startsWith("data: ")) continue;
        const data = line.slice(6).trim();
        if(data === "[DONE]") continue;

        try{
          const json = JSON.parse(data);
          const delta = (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) || "";
          if(!delta) continue;

          fullText += delta;

          if(!started){
            out.innerHTML = "";
            started = true;
          }
          out.innerHTML = md(fullText, true) + '<span class="cursor"></span>';
        }catch(e){}
      }
    }

    if(fullText){
      out.innerHTML = md(fullText, false);
    } else {
      out.innerHTML = '<div class="err">پاسخی دریافت نشد</div>';
    }
    actions.classList.remove("hide");

  }catch(e){
    out.className="err";
    out.textContent=e.isRateLimit
      ? "⚠️ تعداد درخواست‌ها زیاد است. "+(e.remaining_minutes?e.remaining_minutes+" دقیقه دیگر امتحان کنید.":"")
      : "❌ "+e.message;
    actions.classList.remove("hide");
  }
}

// ============================================================
// Markdown - با پشتیبانی Streaming
// ============================================================
function md(t, isStreaming){
  if(isStreaming){
    const count = (t.match(/```/g) || []).length;
    if(count % 2 === 1){
      t = t + "\n```";
    }
  }

  let cb=[];
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{cb.push(`<pre>${esc(c.trim())}</pre>`);return `__CB_${cb.length-1}__`;});
  t=esc(t);
  t=t.replace(/^## (.+)$/gm,"<h2>$1</h2>");
  t=t.replace(/^### (.+)$/gm,"<h3>$1</h3>");
  t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
  t=t.replace(/__CB_(\d+)__/g,(_,i)=>cb[i]);
  return t.split("\n").map(l=>{if(!l.trim())return "";if(l.trim().startsWith("<"))return l;return `<p>${l}</p>`;}).join("");
}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function escapeHTML(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function back(){document.getElementById("langs").classList.remove("hide");document.getElementById("topics").classList.add("hide");document.getElementById("res").classList.add("hide");window.scrollTo(0,0);}
function back2(){document.getElementById("topics").classList.remove("hide");document.getElementById("res").classList.add("hide");document.getElementById("res").scrollTop=0;window.scrollTo(0,0);}

async function startQuiz(){
  document.getElementById("quiz").classList.remove("hide");
  document.getElementById("quizProgress").textContent="در حال ساخت سوالات...";
  document.getElementById("quizScore").textContent="";
  document.getElementById("quizQuestion").textContent="";
  document.getElementById("quizOptions").innerHTML='<div class="load" style="padding:20px">در حال آماده‌سازی</div>';
  const p=`درباره موضوع "${CT.t}" از زبان ${CL.n}"، دقیقا ۵ سوال سه‌گزینه‌ای آموزشی بساز. فقط آرایه JSON:\n[{"q":"سوال","o":["گزینه اول","گزینه دوم","گزینه سوم"],"a":0}]`;
  try{
    const d=await callAI({messages:[{role:"user",content:p}],temperature:0.8,max_tokens:1500,request_type:"quiz"});
    let txt=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
    txt=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
    const start=txt.indexOf("[");const end=txt.lastIndexOf("]");
    if(start===-1||end===-1)throw new Error("پاسخ نامعتبر");
    const qs=JSON.parse(txt.slice(start,end+1));
    if(!Array.isArray(qs)||!qs.length)throw new Error("سوالی ساخته نشد");
    quizData=qs;quizIdx=0;quizScore=0;showQuestion();
  }catch(e){
    document.getElementById("quizProgress").textContent="";
    document.getElementById("quizQuestion").innerHTML=`<span style="color:#e74c3c">❌ ${esc(e.message)}</span>`;
    document.getElementById("quizOptions").innerHTML='<div class="quiz-actions"><button class="btn" onclick="startQuiz()">🔄 تلاش دوباره</button></div>';
  }
}
function showQuestion(){
  if(quizIdx>=quizData.length){showScore();return;}
  const q=quizData[quizIdx];
  document.getElementById("quizProgress").textContent=`سوال ${quizIdx+1} از ${quizData.length}`;
  document.getElementById("quizScore").textContent=`امتیاز: ${quizScore}`;
  document.getElementById("quizQuestion").textContent=q.q;
  document.getElementById("quizOptions").innerHTML=q.o.map((opt,i)=>`<button class="quiz-opt" onclick="answerQ(${i})">${esc(opt)}</button>`).join("");
}
function answerQ(i){
  const q=quizData[quizIdx];
  document.querySelectorAll('.quiz-opt').forEach((b,idx)=>{b.disabled=true;if(idx===q.a)b.classList.add('correct');if(idx===i&&i!==q.a)b.classList.add('wrong');});
  if(i===q.a)quizScore++;
  document.getElementById("quizScore").textContent=`امتیاز: ${quizScore}`;
  setTimeout(()=>{quizIdx++;showQuestion();},900);
}
function showScore(){
  const pct=Math.round((quizScore/quizData.length)*100);
  const emoji=pct>=80?'🎉':pct>=50?'👍':'📚';
  document.getElementById("quizProgress").textContent="";
  document.getElementById("quizScore").textContent="";
  document.getElementById("quizQuestion").innerHTML=`<div style="text-align:center;padding:15px 0"><div style="font-size:54px;margin-bottom:12px">${emoji}</div><div style="font-size:20px;font-weight:bold;color:#667eea">${quizScore} از ${quizData.length}</div><div style="color:#888;margin-top:6px;font-size:14px">${pct}% درست</div></div>`;
  document.getElementById("quizOptions").innerHTML=`<div class="quiz-actions"><button class="btn" onclick="startQuiz()">🔄 آزمون جدید</button><button class="btn gray" onclick="closeQuiz()">بستن</button></div>`;
}

// ============================================================
// Auto-indent
// ============================================================
function lineStart(v,pos){let i=pos;while(i>0&&v[i-1]!=="\n")i--;return i;}
function getIndent(v,ls){let ind="";let j=ls;while(j<v.length&&(v[j]===" "||v[j]==="\t")){ind+=v[j];j++;}return ind;}
function smartDedent(ta,closeC,openC){
  const pos=ta.selectionStart;
  if(ta.value[pos-1]!==closeC)return;
  const ls=lineStart(ta.value,pos-1);
  const before=ta.value.substring(ls,pos-1);
  if(before.trim()!=="")return;
  let depth=1,i=pos-2;
  while(i>=0&&depth>0){if(ta.value[i]===closeC)depth++;else if(ta.value[i]===openC)depth--;if(depth===0)break;i--;}
  if(depth!==0)return;
  const ols=lineStart(ta.value,i);
  const indent=getIndent(ta.value,ols);
  const nv=ta.value.substring(0,ls)+indent+ta.value.substring(pos-1);
  ta.value=nv;
  const delta=indent.length-before.length;
  const np=pos+delta;
  ta.setSelectionRange(np,np);
  if(currentEditorLang)editorState[currentEditorLang]=ta.value;
}

// ============================================================
// Autocomplete
// ============================================================
function handleInput(){
  if(!currentEditorLang)return;
  if(_inputTimer)clearTimeout(_inputTimer);
  _inputTimer=setTimeout(processInput,60);
}
function processInput(){
  if(!currentEditorLang)return;
  const ta=document.getElementById("edCode");
  const pos=ta.selectionStart;
  if(pos!==ta.selectionEnd){hideSuggest();return;}
  const start0=Math.max(0,pos-40);
  let start=pos;
  while(start>start0&&WORD_CHARS.test(ta.value[start-1]))start--;
  let word=ta.value.substring(start,pos);
  let matchWord=word;
  if(currentEditorLang==="html"&&matchWord.startsWith("<"))matchWord=matchWord.substring(1);
  if(matchWord.length<1||matchWord.startsWith("/")){hideSuggest();return;}
  const cfg=EDITOR_CONFIGS[currentEditorLang];
  const list=cfg.sug||[];
  const lw=matchWord.toLowerCase();
  const matches=[];
  for(let i=0;i<list.length;i++){
    if(list[i].k.toLowerCase().startsWith(lw)){matches.push(list[i]);if(matches.length>=12)break;}
  }
  if(matches.length===0||(matches.length===1&&matches[0].k.toLowerCase()===lw)){hideSuggest();return;}
  showSuggest(matches,start,pos);
}
function showSuggest(matches,start,end){
  currentSuggestions=matches;activeSugIdx=0;
  sugRange.start=start;sugRange.end=end;
  const box=document.getElementById("edSuggest");
  let html="";
  for(let i=0;i<matches.length;i++){
    const s=matches[i];
    html+=`<button type="button" class="sug-item${i===0?' active':''}" data-idx="${i}"><span class="sug-code">${escapeHTML(s.k)}</span><span class="sug-desc">${escapeHTML(s.d||"")}</span></button>`;
  }
  box.innerHTML=html;
  box.classList.remove("hide");
  positionSuggestBox();
  box.onclick=function(e){
    const btn=e.target.closest(".sug-item");
    if(!btn)return;
    applySuggestion(currentSuggestions[parseInt(btn.getAttribute("data-idx"),10)]);
  };
}
function positionSuggestBox(){
  const ta=document.getElementById("edCode");
  const box=document.getElementById("edSuggest");
  const pos=getCaretPos(ta);
  const boxW=230,boxH=220;
  let top=pos.top,left=pos.left;
  if(top<10)top=10;
  if(top+boxH>window.innerHeight-10)top=Math.max(10,pos.top-boxH-4);
  if(left+boxW>window.innerWidth-10)left=window.innerWidth-boxW-10;
  if(left<10)left=10;
  box.style.top=top+"px";box.style.left=left+"px";
}
function getCaretPos(ta){
  const div=document.createElement("div");
  const cs=window.getComputedStyle(ta);
  const props=["fontFamily","fontSize","fontWeight","fontStyle","letterSpacing","lineHeight","textTransform","paddingTop","paddingRight","paddingBottom","paddingLeft","borderTopWidth","borderRightWidth","borderBottomWidth","borderLeftWidth","boxSizing","whiteSpace","wordWrap","wordBreak","direction","textAlign","tabSize"];
  div.style.cssText="position:absolute;visibility:hidden;top:-9999px;left:-9999px;overflow:hidden;white-space:pre-wrap;word-wrap:break-word;";
  div.style.width=ta.offsetWidth+"px";div.style.height="auto";
  for(const p of props){try{div.style[p]=cs[p];}catch(e){}}
  div.textContent=ta.value.substring(0,ta.selectionStart);
  const span=document.createElement("span");
  span.textContent=ta.value.substring(ta.selectionStart)||".";
  div.appendChild(span);
  document.body.appendChild(div);
  const spanRect=span.getBoundingClientRect();
  const lineHeight=parseFloat(cs.lineHeight)||18;
  const result={top:spanRect.top+lineHeight,left:spanRect.left};
  document.body.removeChild(div);
  return result;
}
function hideSuggest(){
  const box=document.getElementById("edSuggest");
  if(box&&!box.classList.contains("hide"))box.classList.add("hide");
  currentSuggestions=[];activeSugIdx=-1;
}
function applySuggestion(s){
  if(!s)return;
  const ta=document.getElementById("edCode");
  const v=ta.value;
  const before=v.substring(0,sugRange.start);
  const after=v.substring(sugRange.end);
  const ins=s.ins;
  const cm=ins.indexOf("|");
  const clean=cm===-1?ins:ins.replace("|","");
  ta.value=before+clean+after;
  const newPos=cm===-1?sugRange.start+clean.length:sugRange.start+cm;
  ta.focus();
  try{ta.setSelectionRange(newPos,newPos);}catch(e){}
  if(currentEditorLang)editorState[currentEditorLang]=ta.value;
  hideSuggest();
}
function handleKeyDown(e){
  const box=document.getElementById("edSuggest");
  const visible=box&&!box.classList.contains("hide");
  if(visible){
    if(e.key==="Escape"){e.preventDefault();hideSuggest();return;}
    if(e.key==="ArrowDown"){e.preventDefault();activeSugIdx=Math.min(activeSugIdx+1,currentSuggestions.length-1);updateActiveSug();return;}
    if(e.key==="ArrowUp"){e.preventDefault();activeSugIdx=Math.max(activeSugIdx-1,0);updateActiveSug();return;}
    if(e.key==="Enter"||e.key==="Tab"){
      if(activeSugIdx>=0&&currentSuggestions[activeSugIdx]){e.preventDefault();applySuggestion(currentSuggestions[activeSugIdx]);return;}
    }
  }
  const isCode = currentEditorLang && currentEditorLang !== "html";
  if(isCode && PAIRS[e.key] && !e.ctrlKey && !e.metaKey && !e.altKey){
    const ta = e.target;
    setTimeout(()=>smartDedent(ta, e.key, PAIRS[e.key]), 0);
    return;
  }
  if(e.key === "Enter" && isCode && !e.shiftKey && !e.ctrlKey){
    const ta = e.target;
    const pos = ta.selectionStart;
    if(pos === ta.selectionEnd){
      const beforeChar = ta.value[pos-1];
      const afterChar = ta.value[pos];
      const isOpenBrace = beforeChar === "{";
      const isPyColon = beforeChar === ":" && currentEditorLang === "py";
      if(isOpenBrace || isPyColon){
        e.preventDefault();
        const ls = lineStart(ta.value, pos);
        const indent = getIndent(ta.value, ls);
        const inner = indent + "    ";
        const closeAfter = isOpenBrace && afterChar === "}";
        const ins = closeAfter ? ("\n" + inner + "\n" + indent) : ("\n" + inner);
        ta.value = ta.value.substring(0, pos) + ins + ta.value.substring(pos);
        const np = closeAfter ? (pos + 1 + inner.length) : (pos + ins.length);
        ta.setSelectionRange(np, np);
        if(currentEditorLang) editorState[currentEditorLang] = ta.value;
        hideSuggest();
        return;
      }
    }
  }
  if(e.key==="Tab"&&!visible){
    e.preventDefault();
    const ta=e.target;
    const s=ta.selectionStart,en=ta.selectionEnd;
    ta.value=ta.value.substring(0,s)+"    "+ta.value.substring(en);
    ta.setSelectionRange(s+4,s+4);
    if(currentEditorLang)editorState[currentEditorLang]=ta.value;
  }
}
function updateActiveSug(){
  const box=document.getElementById("edSuggest");
  if(!box)return;
  const items=box.querySelectorAll(".sug-item");
  for(let i=0;i<items.length;i++)items[i].classList.toggle("active",i===activeSugIdx);
  if(items[activeSugIdx]){try{items[activeSugIdx].scrollIntoView({block:"nearest"});}catch(e){}}
}

// ============================================================
// اجرای کد با AI
// ============================================================
async function runWithAI(code, langLabel){
  const p = `تو یک شبیه‌ساز دقیق اجرای کد ${langLabel} هستی.
کد زیر را در ذهنت اجرا کن و فقط خروجی دقیق برنامه را برگردان.
بدون توضیح، بدون backtick، بدون متن اضافه. فقط خروجی خالص.
اگر خطای کامپایل/اجرا دارد، فقط پیام خطای کوتاه.

کد ${langLabel}:
\`\`\`
${code}
\`\`\``;
  const d = await callAI({messages:[{role:"user",content:p}],temperature:0,max_tokens:800,request_type:"run_code"});
  const txt=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
  return txt||"(بدون خروجی)";
}
async function runCode(){
  const id=currentEditorLang,cfg=EDITOR_CONFIGS[id];
  if(!cfg)return;
  const code=document.getElementById("edCode").value;
  editorState[id]=code;
  hideSuggest();
  document.getElementById("edOutput").classList.remove("hide");
  const runBtn=document.getElementById("edRunBtn");
  if(cfg.exec==="iframe"){showPreviewHTML(code);return;}
  showOutputText("⏳ در حال اجرا...",false);
  runBtn.disabled=true;const oldTxt=runBtn.textContent;runBtn.textContent="⏳";
  try{
    const output=await runWithAI(code,cfg.label);
    showOutputText(output,false);
  }catch(e){
    let msg="❌ خطا: "+(e.message||e);
    if(e.isRateLimit)msg="⚠️ تعداد درخواست‌ها زیاد است. "+(e.remaining_minutes?e.remaining_minutes+" دقیقه دیگر امتحان کنید.":"");
    showOutputText(msg,true);
  }finally{runBtn.disabled=false;runBtn.textContent=oldTxt;}
}

// ============================================================
// ساخت کد با AI
// ============================================================
async function aiHelp(){
  const input=document.getElementById("edAiInput"),btn=document.getElementById("edAiBtn");
  const prompt=input.value.trim();
  if(!prompt)return;
  const id=currentEditorLang,cfg=EDITOR_CONFIGS[id];
  if(!cfg)return;
  const currentCode=document.getElementById("edCode").value;
  input.disabled=true;btn.disabled=true;
  const oldTxt=btn.textContent;btn.textContent="...";
  hideSuggest();
  const p=`تو یک دستیار متخصص ${cfg.label} هستی.\nدرخواست: "${prompt}"\n\nکد فعلی:\n${currentCode}\n\nفقط کد کامل و آماده اجرای ${cfg.label} رو برگردون. بدون توضیح، بدون \`\`\`.`;
  try{
    const d=await callAI({messages:[{role:"user",content:p}],temperature:0.4,max_tokens:2500,request_type:"editor_ai"});
    let txt=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
    txt=txt.replace(/^```[a-zA-Z0-9+#-]*\s*/i,"").replace(/```\s*$/,"").trim();
    if(!txt)throw new Error("پاسخی نیامد");
    document.getElementById("edCode").value=txt;
    editorState[id]=txt;
    input.value="";
  }catch(e){
    if(e.isRateLimit)alert("⚠️ تعداد درخواست‌ها زیاد است. "+(e.remaining_minutes?e.remaining_minutes+" دقیقه دیگر امتحان کنید.":""));
    else alert("❌ "+e.message);
  }finally{input.disabled=false;btn.disabled=false;btn.textContent=oldTxt;}
}
