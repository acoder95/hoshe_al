html,body{-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
body{font-family:Tahoma,sans-serif;background:#fff;min-height:100vh;padding:20px;direction:rtl;overflow-x:hidden}
.box{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{padding:22px 12px;background:#f7f8fa;border:2px solid #eaeaea;border-radius:14px;text-align:center;cursor:pointer;font-weight:bold;transition:transform .15s,border-color .15s;will-change:transform}

.card.active{background:#667eea;border-color:#667eea;color:#fff;box-shadow:0 10px 25px rgba(102,126,234,.35)}
.card .ico{font-size:34px;display:block;margin-bottom:8px}
.card .name{font-size:15px}
.topics-list{content-visibility:auto;contain-intrinsic-size:auto 1000px}
.topic{padding:14px 18px;background:#f7f8fa;border-right:4px solid #667eea;border-radius:10px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .15s}
.topic:hover{background:#eef2ff}
.topic:active{background:#e0e7ff}
.tag{background:#667eea;color:#fff;padding:3px 12px;border-radius:20px;font-size:12px;white-space:nowrap;flex-shrink:0}
.tag.easy{background:#27ae60}.tag.med{background:#f39c12}.tag.hard{background:#e74c3c}
button.btn{padding:11px 20px;border:none;border-radius:10px;background:#667eea;color:#fff;font-family:Tahoma;font-size:14px;cursor:pointer;font-weight:bold;margin:5px}
button.btn:hover{background:#5568d3}
button.btn.gray{background:#eee;color:#333}
.editor-btn{background:#27ae60;width:100%;margin:0 0 10px 0;padding:13px;font-size:14px}
.editor-btn:hover{background:#219a52}
#res{position:fixed;top:0;right:0;left:0;bottom:0;background:#fff;z-index:100;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateZ(0);will-change:scroll-position}
.result-header{position:sticky;top:0;background:#fff;border-bottom:2px solid #eaeaea;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px;z-index:10;transform:translateZ(0)}
.back-btn{padding:10px 20px;background:#667eea;color:#fff;border:none;border-radius:10px;font-family:Tahoma;font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap;flex-shrink:0}
.back-btn:hover{background:#5568d3}
.topic-title-bar{font-size:16px;font-weight:bold;color:#333;text-align:left;flex:1;padding-left:10px;overflow:hidden}
.topic-title-bar small{color:#999;font-weight:normal;font-size:12px;display:block;margin-bottom:2px}
.topic-title-bar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-body{padding:25px;max-width:1400px;margin:0 auto;content-visibility:auto}
#out{line-height:2;font-size:15px}
#out h2{color:#667eea;font-size:18px;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid #eaeaea}
#out h3{color:#764ba2;font-size:16px;margin:12px 0 6px}
#out p{margin-bottom:8px;line-height:1.9}
#out pre{background:#1e1e1e;color:#d4d4d4;padding:15px;border-radius:8px;direction:ltr;text-align:left;font-size:13px;line-height:1.7;margin:10px 0;font-family:'Courier New',Consolas,monospace;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:pre;max-width:100%;transform:translateZ(0)}
#out pre::-webkit-scrollbar{height:6px}
#out pre::-webkit-scrollbar-track{background:#2d2d2d;border-radius:10px}
#out pre::-webkit-scrollbar-thumb{background:#667eea;border-radius:10px}
#out code{background:#2d2d2d;color:#4ec9b0;padding:2px 6px;border-radius:4px;font-family:monospace;direction:ltr;display:inline-block}
.actions-wrap{display:flex;gap:10px;justify-content:flex-start;margin-top:25px;padding:20px 0;border-top:1px solid #eaeaea;flex-wrap:wrap}
.actions-wrap.hide{display:none!important}
.btn-act{padding:11px 18px;border:none;border-radius:10px;background:#667eea;color:#fff;font-family:Tahoma;font-size:14px;font-weight:bold;cursor:pointer;transition:background .15s}
.btn-act:hover{background:#5568d3}
.btn-act.quiz{background:#f39c12}
.btn-act.quiz:hover{background:#e67e22}
.load{text-align:center;padding:40px;color:#667eea;font-weight:bold;font-size:16px}
.load::after{content:'...';animation:d 1.2s infinite}
@keyframes d{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
.err{background:#fff5f5;border-right:4px solid #e74c3c;color:#e74c3c;padding:20px;border-radius:10px}
.hide{display:none!important}
.topics-title{font-size:16px;color:#333;margin:15px 0}
#quiz{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:15px}
#quiz.hide{display:none}
.quiz-box{background:#fff;border-radius:16px;padding:22px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;position:relative}
.quiz-close{position:absolute;top:12px;left:12px;background:#eee;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:#333;font-family:Tahoma;line-height:1}
.quiz-close:hover{background:#ddd}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #eaeaea;font-weight:bold;color:#333;font-size:14px;padding-left:40px}
.quiz-header .score{color:#667eea}
#quizQuestion{font-size:16px;line-height:1.9;margin-bottom:18px;color:#222;min-height:60px}
.quiz-opt{display:block;width:100%;padding:14px 18px;margin-bottom:10px;border:2px solid #e0e0e0;border-radius:10px;background:#f7f8fa;font-family:Tahoma;font-size:15px;text-align:right;cursor:pointer;transition:all .15s;color:#333}
.quiz-opt:hover:not(:disabled){border-color:#667eea;background:#eef2ff}
.quiz-opt.correct{background:#d4edda;border-color:#27ae60;color:#155724}
.quiz-opt.wrong{background:#f8d7da;border-color:#e74c3c;color:#721c24}
.quiz-opt:disabled{cursor:default}
.quiz-actions{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}
#editor{position:fixed;inset:0;background:#fff;z-index:300;display:flex;flex-direction:column}
.ed-header{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:#fff;border-bottom:2px solid #eaeaea;gap:10px}
.ed-run{background:#27ae60;color:#fff;border:none;padding:9px 16px;border-radius:9px;font-family:Tahoma;font-size:13px;font-weight:bold;cursor:pointer;white-space:nowrap}
.ed-run:hover{background:#219a52}
.ed-ai{display:flex;gap:8px;padding:10px 15px;background:#f7f8fa;border-bottom:1px solid #eaeaea}
.ed-ai input{flex:1;padding:10px 14px;border:2px solid #e0e0e0;border-radius:9px;font-family:Tahoma;font-size:13px;outline:none;background:#fff;color:#333;min-width:0}
.ed-ai input:focus{border-color:#667eea}

            navigator.language,
            Intl.DateTimeFormat().resolvedOptions().timeZone

        return Math.abs(hash).toString(36);

async function ask(again){
const out=document.getElementById("out");
const actions=document.getElementById("actionsWrap");
const isAgain=again===true;
actions.classList.add("hide");
const p=isAgain?`موضوع "${CT.t}" از ${CL.n} رو ساده و سریع توضیح بده. از مثال روزمره و تشبیه استفاده کن. خط به خط کد رو توضیح بده. کوتاه و مفید.`:`موضوع "${CT.t}" از ${CL.n} رو سریع و کوتاه آموزش بده.\nساختار:\n## توضیح ساده\n## نمونه کد ۱\n\`\`\`\n[کد]\n\`\`\`\n## نمونه کد ۲\n\`\`\`\n[کد]\n\`\`\`\n## اشتباهات رایج\n## نکته طلایی\nکوتاه، فارسی، کاربردی.`;
out.className="load";out.textContent=`در حال آموزش ${CT.t}`;
document.getElementById("res").scrollTop=0;
try{
const d = await callAI({
    messages: [{ role: "user", content: p }],
    temperature: 0.3,
    max_tokens: 1200,
    request_type: isAgain ? "ask_again" : "ask"
});
const txt = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
if(!txt) throw new Error("پاسخی نیامد");
out.className="";out.innerHTML=md(txt);
actions.classList.remove("hide");
}catch(e){
  if(e.isRateLimit){
    out.className="err";
    out.textContent = "⚠️ تعداد درخواست‌ها زیاد است. " + (e.remaining_minutes ? e.remaining_minutes + " دقیقه دیگر امتحان کنید." : "");
  } else {
    out.className="err";
    out.textContent="❌ " + e.message;
  }
  actions.classList.remove("hide");
}
}

function md(t){
  let codeBlocks = [];
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => {
    codeBlocks.push(`<pre>${esc(c.trim())}</pre>`);
    return `__CODE_BLOCK_${codeBlocks.length - 1}__`;
  });
  t = esc(t);
  t = t.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  t = t.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/__CODE_BLOCK_(\d+)__/g, (_, i) => codeBlocks[i]);
  return t.split("\n").map(l => {
    if (!l.trim()) return "";
    if (l.trim().startsWith("<")) return l;
    return `<p>${l}</p>`;
  }).join("");
}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

document.getElementById("quizOptions").innerHTML='<div class="load" style="padding:20px">در حال آماده‌سازی</div>';
const p=`درباره موضوع "${CT.t}" از زبان ${CL.n}، دقیقا ۵ سوال سه‌گزینه‌ای آموزشی بساز. 
فقط و فقط یک آرایه JSON برگردون بدون هیچ متن اضافه، بدون \`\`\`، بدون توضیح. 
فرمت دقیق: 
[{"q":"متن سوال","o":["گزینه اول","گزینه دوم","گزینه سوم"],"a":0}] 
که a ایندکس گزینه صحیح (0 یا 1 یا 2) است. 
سوالات باید متنوع، آموزشی و در سطح موضوع باشند.`;
try{
const d = await callAI({
    messages: [{ role: "user", content: p }],
    temperature: 0.8,
    max_tokens: 1500,
    request_type: "quiz"
});
let txt=(d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content || "").trim();
txt=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
const start=txt.indexOf("[");const end=txt.lastIndexOf("]");
if(start===-1||end===-1)throw new Error("پاسخ نامعتبر");
const qs=JSON.parse(txt.slice(start,end+1));
if(!Array.isArray(qs)||!qs.length)throw new Error("سوالی ساخته نشد");
quizData=qs;quizIdx=0;quizScore=0;
showQuestion();
}catch(e){
  if(e.isRateLimit){
    document.getElementById("quizProgress").textContent="";
    document.getElementById("quizQuestion").innerHTML=`<span style="color:#e67e22">⚠️ ${e.remaining_minutes ? e.remaining_minutes + " دقیقه دیگر امتحان کنید." : "لطفاً صبر کنید..."}</span>`;
    document.getElementById("quizOptions").innerHTML='<div class="quiz-actions"><button class="btn" onclick="closeQuiz()">بستن</button></div>';
  } else {
    document.getElementById("quizProgress").textContent="";
    document.getElementById("quizQuestion").innerHTML=`<span style="color:#e74c3c">❌ خطا: ${esc(e.message)}</span>`;
    document.getElementById("quizOptions").innerHTML='<div class="quiz-actions"><button class="btn" onclick="startQuiz()">🔄 تلاش دوباره</button></div>';
  }
}
}

function showQuestion(){
if(quizIdx>=quizData.length){showScore();return;}
const q=quizData[quizIdx];
document.getElementById("quizProgress").textContent=`سوال ${quizIdx+1} از ${quizData.length}`;
document.getElementById("quizScore").textContent=`امتیاز: ${quizScore}`;
document.getElementById("quizQuestion").textContent=q.q;
document.getElementById("quizOptions").innerHTML=q.o.map((opt,i)=>`<button class="quiz-opt" onclick="answerQ(${i})">${esc(opt)}</button>`).join("");
}
function answerQ(i){
const q=quizData[quizIdx];
const btns=document.querySelectorAll('.quiz-opt');
btns.forEach((b,idx)=>{b.disabled=true;if(idx===q.a)b.classList.add('correct');if(idx===i&&i!==q.a)b.classList.add('wrong');});
if(i===q.a)quizScore++;
document.getElementById("quizScore").textContent=`امتیاز: ${quizScore}`;
setTimeout(()=>{quizIdx++;showQuestion();},900);
}
function showScore(){
const pct=Math.round((quizScore/quizData.length)*100);
const emoji=pct>=80?'🎉':pct>=50?'👍':'📚';
const msg=pct>=80?'عالی بودی!':pct>=50?'خوب بود، ادامه بده!':'بازم تمرین کن!';
document.getElementById("quizProgress").textContent="";
document.getElementById("quizScore").textContent="";
document.getElementById("quizQuestion").innerHTML=`
<div style="text-align:center;padding:15px 0">
<div style="font-size:54px;margin-bottom:12px">${emoji}</div>
<div style="font-size:16px;color:#555;margin-bottom:10px">${msg}</div>
<div style="font-size:20px;font-weight:bold;color:#667eea">${quizScore} از ${quizData.length}</div>
<div style="color:#888;margin-top:6px;font-size:14px">${pct}% درست</div>
</div>`;
document.getElementById("quizOptions").innerHTML=`
<div class="quiz-actions">
<button class="btn" onclick="startQuiz()">🔄 آزمون جدید</button>
<button class="btn gray" onclick="closeQuiz()">بستن</button>
</div>`;
}
function closeQuiz(){document.getElementById("quiz").classList.add("hide");}

/* ===== HTML Editor ===== */
let htmlEdCode = `<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>صفحه من</title>
<style>
body{font-family:Tahoma,sans-serif;padding:20px;background:#f0f4ff}
h1{color:#667eea}
</style>
</head>
<body>
<h1>سلام دنیا! 👋</h1>
<p>اینجا کد HTML خودت رو بنویس یا از AI بخواه برات بسازه</p>
</body>
</html>`;

function openEditor(){
  document.getElementById("editor").classList.remove("hide");
  document.getElementById("edCode").value = htmlEdCode;
  runCode();
}
function closeEditor(){
  htmlEdCode = document.getElementById("edCode").value;
  document.getElementById("editor").classList.add("hide");
}
function runCode(){
  const code = document.getElementById("edCode").value;
  const iframe = document.getElementById("edPreview");
  try{
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open(); doc.write(code); doc.close();
  }catch(e){}
}

async function aiHelp(){
  const input = document.getElementById("edAiInput");
  const btn = document.getElementById("edAiBtn");
  const prompt = input.value.trim();
  if(!prompt) return;
  const currentCode = document.getElementById("edCode").value;
  input.disabled = true; btn.disabled = true;
  const oldTxt = btn.textContent;
  btn.textContent = "...";
  const p = `تو یک دستیار متخصص HTML و CSS هستی و به فارسی جواب می‌دی.
درخواست کاربر: "${prompt}"

کد HTML فعلی:
${currentCode}

فقط و فقط کد کامل و آماده اجرای HTML رو برگردون. بدون توضیح، بدون \`\`\`، بدون متن اضافه. اگر درخواست کاربر مربوط به تغییر کد فعلی نیست، از صفر بساز. زبان فارسی در محتوا رعایت بشه.`;
  try{
    const d = await callAI({
        messages: [{ role: "user", content: p }],
        temperature: 0.4,
        max_tokens: 4000,
        request_type: "editor_ai"
    });
    let txt = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content || "").trim();
    txt = txt.replace(/^```html\s*/i,"").replace(/^```\s*/,"").replace(/```\s*$/,"").trim();
    if(!txt) throw new Error("پاسخی نیامد");
    document.getElementById("edCode").value = txt;
    htmlEdCode = txt;
    runCode();
    input.value = "";
  }catch(e){
    if(e.isRateLimit){
      alert("⚠️ تعداد درخواست‌ها زیاد است. " + (e.remaining_minutes ? e.remaining_minutes + " دقیقه دیگر امتحان کنید." : ""));
    } else {
      alert("❌ " + e.message);
    }
  }finally{
    input.disabled = false; btn.disabled = false; btn.textContent = oldTxt;
  }
}
</script>
</body>
</html>
