*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{-webkit-overflow-scrolling:touch;overscroll-behavior-y:none}
body{font-family:Tahoma,sans-serif;background:#fff;min-height:100vh;padding:20px;direction:rtl;overflow-x:hidden}
.box{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{padding:22px 12px;background:#f7f8fa;border:2px solid #eaeaea;border-radius:14px;text-align:center;cursor:pointer;font-weight:bold;transition:transform .15s,border-color .15s;will-change:transform}

.card.active{background:#667eea;border-color:#667eea;color:#fff;box-shadow:0 10px 25px rgba(102,126,234,.35)}
.card .ico{font-size:34px;display:block;margin-bottom:8px}
.card .name{font-size:15px}
.topics-list{content-visibility:auto;contain-intrinsic-size:auto 1000px}
.topic{padding:14px 18px;background:#f7f8fa;border-right:4px solid #667eea;border-radius:10px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:background .15s}
.topic:hover{background:#eef2ff}
.topic:active{background:#e0e7ff}
.tag{background:#667eea;color:#fff;padding:3px 12px;border-radius:20px;font-size:12px;white-space:nowrap;flex-shrink:0}
.tag.easy{background:#27ae60}.tag.med{background:#f39c12}.tag.hard{background:#e74c3c}
button.btn{padding:11px 20px;border:none;border-radius:10px;background:#667eea;color:#fff;font-family:Tahoma;font-size:14px;cursor:pointer;font-weight:bold;margin:5px}
button.btn:hover{background:#5568d3}
button.btn.gray{background:#eee;color:#333}
.editor-btn{background:#27ae60;width:100%;margin:0 0 10px 0;padding:13px;font-size:14px}
.editor-btn:hover{background:#219a52}
#res{position:fixed;top:0;right:0;left:0;bottom:0;background:#fff;z-index:100;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateZ(0);will-change:scroll-position}
.result-header{position:sticky;top:0;background:#fff;border-bottom:2px solid #eaeaea;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:15px;z-index:10;transform:translateZ(0)}
.back-btn{padding:10px 20px;background:#667eea;color:#fff;border:none;border-radius:10px;font-family:Tahoma;font-size:14px;font-weight:bold;cursor:pointer;white-space:nowrap;flex-shrink:0}
.back-btn:hover{background:#5568d3}
.topic-title-bar{font-size:16px;font-weight:bold;color:#333;text-align:left;flex:1;padding-left:10px;overflow:hidden}
.topic-title-bar small{color:#999;font-weight:normal;font-size:12px;display:block;margin-bottom:2px}
.topic-title-bar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-body{padding:25px;max-width:1400px;margin:0 auto;content-visibility:auto}
#out{line-height:2;font-size:15px}
#out h2{color:#667eea;font-size:18px;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid #eaeaea}
#out h3{color:#764ba2;font-size:16px;margin:12px 0 6px}
#out p{margin-bottom:8px;line-height:1.9}
#out pre{background:#1e1e1e;color:#d4d4d4;padding:15px;border-radius:8px;direction:ltr;text-align:left;font-size:13px;line-height:1.7;margin:10px 0;font-family:'Courier New',Consolas,monospace;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:pre;max-width:100%;transform:translateZ(0)}
#out pre::-webkit-scrollbar{height:6px}
#out pre::-webkit-scrollbar-track{background:#2d2d2d;border-radius:10px}
#out pre::-webkit-scrollbar-thumb{background:#667eea;border-radius:10px}
#out code{background:#2d2d2d;color:#4ec9b0;padding:2px 6px;border-radius:4px;font-family:monospace;direction:ltr;display:inline-block}
.actions-wrap{display:flex;gap:10px;justify-content:flex-start;margin-top:25px;padding:20px 0;border-top:1px solid #eaeaea;flex-wrap:wrap}
.actions-wrap.hide{display:none!important}
.btn-act{padding:11px 18px;border:none;border-radius:10px;background:#667eea;color:#fff;font-family:Tahoma;font-size:14px;font-weight:bold;cursor:pointer;transition:background .15s}
.btn-act:hover{background:#5568d3}
.btn-act.quiz{background:#f39c12}
.btn-act.quiz:hover{background:#e67e22}
.load{text-align:center;padding:40px;color:#667eea;font-weight:bold;font-size:16px}
.load::after{content:'...';animation:d 1.2s infinite}
@keyframes d{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
.err{background:#fff5f5;border-right:4px solid #e74c3c;color:#e74c3c;padding:20px;border-radius:10px}
.hide{display:none!important}
.topics-title{font-size:16px;color:#333;margin:15px 0}
#quiz{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:15px}
#quiz.hide{display:none}
.quiz-box{background:#fff;border-radius:16px;padding:22px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;position:relative}
.quiz-close{position:absolute;top:12px;left:12px;background:#eee;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:#333;font-family:Tahoma;line-height:1}
.quiz-close:hover{background:#ddd}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #eaeaea;font-weight:bold;color:#333;font-size:14px;padding-left:40px}
.quiz-header .score{color:#667eea}
#quizQuestion{font-size:16px;line-height:1.9;margin-bottom:18px;color:#222;min-height:60px}
.quiz-opt{display:block;width:100%;padding:14px 18px;margin-bottom:10px;border:2px solid #e0e0e0;border-radius:10px;background:#f7f8fa;font-family:Tahoma;font-size:15px;text-align:right;cursor:pointer;transition:all .15s;color:#333}
.quiz-opt:hover:not(:disabled){border-color:#667eea;background:#eef2ff}
.quiz-opt.correct{background:#d4edda;border-color:#27ae60;color:#155724}
.quiz-opt.wrong{background:#f8d7da;border-color:#e74c3c;color:#721c24}
.quiz-opt:disabled{cursor:default}
.quiz-actions{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap}

#editor{position:fixed;inset:0;background:#fff;z-index:300;display:flex;flex-direction:column;overflow:hidden}
.ed-header{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#fff;border-bottom:2px solid #eaeaea;gap:8px;flex-wrap:nowrap}
.ed-title{font-weight:bold;font-size:14px;color:#333;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ed-run{background:#27ae60;color:#fff;border:none;padding:9px 14px;border-radius:9px;font-family:Tahoma;font-size:13px;font-weight:bold;cursor:pointer;white-space:nowrap;flex-shrink:0}
.ed-run:hover{background:#219a52}
.ed-run:disabled{background:#aaa;cursor:wait}
.ed-icon-btn{background:#f0f0f0;color:#444;border:none;width:38px;height:38px;border-radius:9px;font-size:18px;cursor:pointer;flex-shrink:0;line-height:1;font-family:Tahoma}
.ed-icon-btn:hover{background:#e0e0e0}
.ed-icon-btn.active{background:#667eea;color:#fff}
.ed-ai{display:flex;gap:8px;padding:8px 10px;background:#f7f8fa;border-bottom:1px solid #eaeaea}
.ed-ai input{flex:1;padding:9px 12px;border:2px solid #e0e0e0;border-radius:9px;font-family:Tahoma;font-size:13px;outline:none;background:#fff;color:#333;min-width:0}
.ed-ai input:focus{border-color:#667eea}
.ed-ai button{padding:9px 14px;background:#667eea;color:#fff;border:none;border-radius:9px;font-family:Tahoma;font-size:13px;font-weight:bold;cursor:pointer;white-space:nowrap;transition:background .15s;flex-shrink:0}
.ed-ai button:hover{background:#5568d3}
.ed-ai button:disabled{background:#aaa;cursor:wait}

.ed-body{flex:1;display:flex;overflow:hidden;min-height:0;position:relative}
#edCode{flex:1;padding:14px;border:none;font-family:'Courier New',Consolas,monospace;font-size:13.5px;line-height:1.7;direction:ltr;text-align:left;resize:none;outline:none;background:#fafafa;color:#1a1a1a;width:100%;height:100%;tab-size:4;-moz-tab-size:4;white-space:pre;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;contain:strict;will-change:scroll-position}

.ed-suggest{position:absolute;top:8px;right:8px;left:8px;max-height:45vh;overflow-y:auto;background:#fff;border:2px solid #667eea;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:60;padding:6px;-webkit-overflow-scrolling:touch;contain:layout style paint}
.ed-suggest.hide{display:none!important}
.sug-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 14px;background:#fff;border:none;border-radius:8px;font-family:Tahoma;font-size:13px;text-align:right;cursor:pointer;color:#333;transition:background .08s}
.sug-item:hover,.sug-item.active{background:#eef2ff}
.sug-item .sug-code{font-family:'Courier New',Consolas,monospace;direction:ltr;background:#f4f4f7;padding:2px 8px;border-radius:6px;color:#4a5fd6;font-size:12px;font-weight:bold;flex-shrink:0}
.sug-item .sug-desc{font-size:11px;color:#888;font-family:Tahoma}
.sug-item.active .sug-code{background:#667eea;color:#fff}

.ed-output{position:fixed;inset:0;background:#fff;z-index:400;display:block}
.ed-output.hide{display:none!important}
.ed-output-close{position:fixed;top:12px;right:12px;background:rgba(231,76,60,.96);color:#fff;border:none;padding:10px 18px;border-radius:25px;font-family:Tahoma;font-size:13px;font-weight:bold;cursor:pointer;z-index:401;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:background .15s}
.ed-output-close:hover{background:rgba(192,57,43,1)}
#edPreview{width:100%;height:100%;border:none;background:#fff;display:block}

#editor.fullscreen .ed-ai{display:none!important}

  .topic-title-bar{font-size:14px}
  .topic{padding:12px 14px}
  .btn-act{font-size:13px;padding:10px 14px}
  .ed-header{padding:6px 8px;gap:6px}
  .ed-title{font-size:12.5px}
  .ed-run{padding:8px 12px;font-size:12.5px}
  .ed-icon-btn{width:34px;height:34px;font-size:16px}
  .ed-ai button{padding:8px 11px;font-size:12px}
  .ed-ai input{font-size:12.5px;padding:8px 10px}
  #edCode{font-size:13px;padding:12px}
  .ed-suggest{top:6px;right:6px;left:6px;max-height:40vh}
  .sug-item{padding:9px 12px;font-size:12.5px}
  .ed-output-close{padding:9px 15px;font-size:12.5px;top:10px;right:10px}
}

const WORKER_URL = "https://ancient-thunder-42b4.sadqyamyrmhmd67.workers.dev";

const BROWSER_FP = (function() {
  try {
    const data = [navigator.userAgent,screen.width+"x"+screen.height,navigator.language,Intl.DateTimeFormat().resolvedOptions().timeZone].join("|");
    let hash = 0;
    for (let i=0;i<data.length;i++){hash=((hash<<5)-hash)+data.charCodeAt(i);hash=hash&hash;}
    return Math.abs(hash).toString(36);
  } catch(e){return "unknown";}
})();

async function callAI(payload){
  const res = await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      messages:payload.messages,
      temperature:payload.temperature!==undefined?payload.temperature:0.3,
      top_p:0.95,
      max_tokens:payload.max_tokens||900,
      model:payload.model||"gpt-4o-mini",
      stream:false,
      fingerprint:BROWSER_FP,
      request_type:payload.request_type||"unknown",
      language:CL?CL.id:"",
      topic:CT?CT.t:""
    })
  });
  if(res.status===429){
    const err=await res.json();
    const e2=new Error(err.error||"تعداد درخواست‌ها زیاد است");
    e2.isRateLimit=true;e2.remaining_minutes=err.remaining_minutes||10;
    throw e2;
  }
  if(!res.ok){
    const err=await res.json().catch(()=>({}));
    throw new Error(err.error||"خطا در ارتباط با سرور");
  }
  return res.json();
}

/* ============================================================
   پیش‌بارگذاری (preload) — از لحظه انتخاب زبان شروع می‌شه
   ============================================================ */
let pyodidePromise=null;
let pyodideReady=false;
let sqlPromise=null;
let sqlReady=false;

function preloadPyodide(){
  if(pyodidePromise)return pyodidePromise;
  pyodidePromise=(async()=>{
    if(!window.loadPyodide){
      await new Promise((res,rej)=>{
        const s=document.createElement("script");
        s.src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js";
        s.onload=res;
        s.onerror=()=>rej(new Error("بارگذاری Pyodide ناموفق"));
        document.head.appendChild(s);
      });
    }
    const py=await window.loadPyodide({
      indexURL:"https://cdn.jsdelivr.net/pyodide/v0.26.1/full/",
      stdout:()=>{},
      stderr:()=>{}
    });
    pyodideReady=true;
    return py;
  })();
  return pyodidePromise;
}

function preloadSqlJs(){
  if(sqlPromise)return sqlPromise;
  sqlPromise=(async()=>{
    if(!window.initSqlJs){
      await new Promise((res,rej)=>{
        const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js";
        s.onload=res;
        s.onerror=()=>rej(new Error("بارگذاری sql.js ناموفق"));
        document.head.appendChild(s);
      });
    }
    const SQL=await window.initSqlJs({
      locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`
    });
    sqlReady=true;
    return SQL;
  })();
  return sqlPromise;
}

async function ensurePyodide(){return preloadPyodide();}
async function ensureSqlJs(){return preloadSqlJs();}

function pickLang(id){

  if(hasEditor)document.getElementById("editorOpenBtn").textContent="🖥️ ویرایشگر "+EDITOR_CONFIGS[id].label;
  document.getElementById("tt").textContent=`${CL.i} ${CL.n} - یه موضوع انتخاب کن (${CL.t.length} موضوع):`;
  document.getElementById("tl").innerHTML=CL.t.map((x,i)=>`<div class="topic" onclick="pickTopic(${i})"><span>${x.t}</span><span class="tag ${x.l}">${x.l==="easy"?"آسان":x.l==="med"?"متوسط":"پیشرفته"}</span></div>`).join("");

  }catch(e){
    out.className="err";
    if(e.isRateLimit)out.textContent="⚠️ تعداد درخواست‌ها زیاد است. "+(e.remaining_minutes?e.remaining_minutes+" دقیقه دیگر امتحان کنید.":"");
    else out.textContent="❌ "+e.message;
    actions.classList.remove("hide");
  }
}

function md(t){
  let codeBlocks=[];
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{codeBlocks.push(`<pre>${esc(c.trim())}</pre>`);return `__CODE_BLOCK_${codeBlocks.length-1}__`;});
  t=esc(t);
  t=t.replace(/^## (.+)$/gm,"<h2>$1</h2>");
  t=t.replace(/^### (.+)$/gm,"<h3>$1</h3>");
  t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
  t=t.replace(/__CODE_BLOCK_(\d+)__/g,(_,i)=>codeBlocks[i]);
  return t.split("\n").map(l=>{
    if(!l.trim())return "";
    if(l.trim().startsWith("<"))return l;
    return `<p>${l}</p>`;
  }).join("");
}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function back(){document.getElementById("langs").classList.remove("hide");document.getElementById("topics").classList.add("hide");document.getElementById("res").classList.add("hide");window.scrollTo(0,0);}
function back2(){document.getElementById("topics").classList.remove("hide");document.getElementById("res").classList.add("hide");document.getElementById("res").scrollTop=0;window.scrollTo(0,0);}

async function startQuiz(){
  document.getElementById("quiz").classList.remove("hide");
  document.getElementById("quizProgress").textContent="در حال ساخت سوالات...";
  document.getElementById("quizScore").textContent="";
  document.getElementById("quizQuestion").textContent="";
  document.getElementById("quizOptions").innerHTML='<div class="load" style="padding:20px">در حال آماده‌سازی</div>';
  const p=`درباره "${CT.t}" از ${CL.n}، ۵ سوال سه‌گزینه‌ای بساز.\nفقط آرایه JSON بدون هیچ متن اضافه:\n[{"q":"سوال","o":["گزینه ۱","گزینه ۲","گزینه ۳"],"a":0}]`;
  try{
    const d=await callAI({messages:[{role:"user",content:p}],temperature:0.8,max_tokens:1200,request_type:"quiz"});
    let txt=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
    txt=txt.replace(/```json/gi,"").replace(/```/g,"").trim();
    const start=txt.indexOf("["),end=txt.lastIndexOf("]");
    if(start===-1||end===-1)throw new Error("پاسخ نامعتبر");
    const qs=JSON.parse(txt.slice(start,end+1));
    if(!Array.isArray(qs)||!qs.length)throw new Error("سوالی ساخته نشد");
    quizData=qs;quizIdx=0;quizScore=0;showQuestion();
  }catch(e){
    if(e.isRateLimit){
      document.getElementById("quizProgress").textContent="";
      document.getElementById("quizQuestion").innerHTML=`<span style="color:#e67e22">⚠️ ${e.remaining_minutes?e.remaining_minutes+" دقیقه دیگر امتحان کنید.":"لطفاً صبر کنید..."}</span>`;
      document.getElementById("quizOptions").innerHTML='<div class="quiz-actions"><button class="btn" onclick="closeQuiz()">بستن</button></div>';
    }else{
      document.getElementById("quizProgress").textContent="";
      document.getElementById("quizQuestion").innerHTML=`<span style="color:#e74c3c">❌ خطا: ${esc(e.message)}</span>`;
      document.getElementById("quizOptions").innerHTML='<div class="quiz-actions"><button class="btn" onclick="startQuiz()">🔄 تلاش دوباره</button></div>';
    }
  }
}
function showQuestion(){
  if(quizIdx>=quizData.length){showScore();return;}
  const q=quizData[quizIdx];
  document.getElementById("quizProgress").textContent=`سوال ${quizIdx+1} از ${quizData.length}`;
  document.getElementById("quizScore").textContent=`امتیاز: ${quizScore}`;
  document.getElementById("quizQuestion").textContent=q.q;
  document.getElementById("quizOptions").innerHTML=q.o.map((opt,i)=>`<button class="quiz-opt" onclick="answerQ(${i})">${esc(opt)}</button>`).join("");
}
function answerQ(i){
  const q=quizData[quizIdx],btns=document.querySelectorAll('.quiz-opt');
  btns.forEach((b,idx)=>{b.disabled=true;if(idx===q.a)b.classList.add('correct');if(idx===i&&i!==q.a)b.classList.add('wrong');});
  if(i===q.a)quizScore++;
  document.getElementById("quizScore").textContent=`امتیاز: ${quizScore}`;
  setTimeout(()=>{quizIdx++;showQuestion();},900);
}
function showScore(){
  const pct=Math.round((quizScore/quizData.length)*100);
  const emoji=pct>=80?'🎉':pct>=50?'👍':'📚';
  const msg=pct>=80?'عالی بودی!':pct>=50?'خوب بود، ادامه بده!':'بازم تمرین کن!';
  document.getElementById("quizProgress").textContent="";
  document.getElementById("quizScore").textContent="";
  document.getElementById("quizQuestion").innerHTML=`<div style="text-align:center;padding:15px 0"><div style="font-size:54px;margin-bottom:12px">${emoji}</div><div style="font-size:16px;color:#555;margin-bottom:10px">${msg}</div><div style="font-size:20px;font-weight:bold;color:#667eea">${quizScore} از ${quizData.length}</div><div style="color:#888;margin-top:6px;font-size:14px">${pct}% درست</div></div>`;
  document.getElementById("quizOptions").innerHTML=`<div class="quiz-actions"><button class="btn" onclick="startQuiz()">🔄 آزمون جدید</button><button class="btn gray" onclick="closeQuiz()">بستن</button></div>`;
}
function closeQuiz(){document.getElementById("quiz").classList.add("hide");}

function openEditor(){
  const id=CL&&CL.id,cfg=EDITOR_CONFIGS[id];
  if(!cfg)return;
  currentEditorLang=id;
  document.getElementById("edTitle").textContent="🖥️ ویرایشگر "+cfg.label;
  document.getElementById("edAiInput").placeholder=`مثلاً: یه برنامه ${cfg.label} برام بساز که ...`;
  const ta=document.getElementById("edCode");
  ta.value=editorState[id]!==undefined?editorState[id]:cfg.starter;
  hideSuggest();
  document.getElementById("edOutput").classList.add("hide");
  document.getElementById("editor").classList.remove("fullscreen");
  document.getElementById("edFullBtn").classList.remove("active");
  document.getElementById("edFullBtn").textContent="⛶";
  document.getElementById("editor").classList.remove("hide");
  ta.oninput=handleInput;
  ta.onkeydown=handleKeyDown;
  ta.onblur=function(){setTimeout(hideSuggest,180);};
  ta.onclick=function(){hideSuggest();};
  // ⚡ شروع پیش‌بارگذاری در پس‌زمینه اگر قبلاً نشده
  if(id==="py"&&!pyodideReady)preloadPyodide().catch(()=>{});
  else if(id==="sql"&&!sqlReady)preloadSqlJs().catch(()=>{});
}

function closeEditor(){
  if(currentEditorLang)editorState[currentEditorLang]=document.getElementById("edCode").value;
  hideSuggest();
  document.getElementById("editor").classList.add("hide");
  document.getElementById("edOutput").classList.add("hide");
}

function toggleFullscreen(){
  const ed=document.getElementById("editor"),btn=document.getElementById("edFullBtn");
  const isFull=ed.classList.toggle("fullscreen");
  if(isFull){btn.classList.add("active");btn.textContent="⤡";}
  else{btn.classList.remove("active");btn.textContent="⛶";}
}

function closeOutput(){document.getElementById("edOutput").classList.add("hide");}

function handleInput(){
  if(!currentEditorLang)return;
  if(_inputTimer)clearTimeout(_inputTimer);
  _inputTimer=setTimeout(processInput,70);
}

function processInput(){
  if(!currentEditorLang)return;
  const ta=document.getElementById("edCode");
  const pos=ta.selectionStart;
  if(pos!==ta.selectionEnd){hideSuggest();return;}
  const start0=Math.max(0,pos-40);
  let start=pos;
  while(start>start0&&WORD_CHARS.test(ta.value[start-1]))start--;
  const word=ta.value.substring(start,pos);
  if(word.length<1){hideSuggest();return;}
  if(word.startsWith("/")){hideSuggest();return;}
  const cfg=EDITOR_CONFIGS[currentEditorLang],list=cfg.sug||[],lw=word.toLowerCase();
  const matches=[];
  for(let i=0;i<list.length;i++){
    const s=list[i];
    if(s.k.toLowerCase().startsWith(lw)){
      matches.push(s);
      if(matches.length>=12)break;
    }
  }
  if(matches.length===0||(matches.length===1&&matches[0].k.toLowerCase()===lw)){hideSuggest();return;}
  showSuggest(matches,start,pos);
}

function showSuggest(matches,start,end){
  currentSuggestions=matches;activeSugIdx=0;
  sugRange.start=start;sugRange.end=end;
  const box=document.getElementById("edSuggest");
  let html="";
  for(let i=0;i<matches.length;i++){
    const s=matches[i];
    const label=s.k.replace(/</g,"&lt;").replace(/>/g,"&gt;");
    html+=`<button type="button" class="sug-item${i===0?' active':''}" data-idx="${i}"><span class="sug-code">${label}</span><span class="sug-desc">${escapeHTML(s.d||"")}</span></button>`;
  }
  box.innerHTML=html;
  box.classList.remove("hide");
  box.onclick=function(e){
    const btn=e.target.closest(".sug-item");
    if(!btn)return;
    const idx=parseInt(btn.getAttribute("data-idx"),10);
    applySuggestion(currentSuggestions[idx]);
  };
}

function escapeHTML(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function hideSuggest(){
  const box=document.getElementById("edSuggest");
  if(box&&!box.classList.contains("hide"))box.classList.add("hide");
  currentSuggestions=[];activeSugIdx=-1;
}

function applySuggestion(s){
  if(!s)return;
  const ta=document.getElementById("edCode"),v=ta.value;
  const before=v.substring(0,sugRange.start),after=v.substring(sugRange.end);
  const ins=s.ins,cursorMark=ins.indexOf("|"),clean=cursorMark===-1?ins:ins.replace("|","");
  ta.value=before+clean+after;
  const newPos=cursorMark===-1?sugRange.start+clean.length:sugRange.start+cursorMark;
  ta.focus();
  try{ta.setSelectionRange(newPos,newPos);}catch(e){}
  if(currentEditorLang)editorState[currentEditorLang]=ta.value;
  hideSuggest();
}

function handleKeyDown(e){
  const box=document.getElementById("edSuggest"),visible=box&&!box.classList.contains("hide");
  if(visible){
    if(e.key==="Escape"){e.preventDefault();hideSuggest();return;}
    if(e.key==="ArrowDown"){e.preventDefault();activeSugIdx=Math.min(activeSugIdx+1,currentSuggestions.length-1);updateActiveSug();return;}
    if(e.key==="ArrowUp"){e.preventDefault();activeSugIdx=Math.max(activeSugIdx-1,0);updateActiveSug();return;}
    if(e.key==="Enter"||e.key==="Tab"){
      if(activeSugIdx>=0&&currentSuggestions[activeSugIdx]){e.preventDefault();applySuggestion(currentSuggestions[activeSugIdx]);return;}
    }
  }
  if(e.key==="Tab"&&!visible){
    e.preventDefault();
    const ta=e.target,s=ta.selectionStart,en=ta.selectionEnd;
    ta.value=ta.value.substring(0,s)+"    "+ta.value.substring(en);
    ta.setSelectionRange(s+4,s+4);
    if(currentEditorLang)editorState[currentEditorLang]=ta.value;
  }
}

function updateActiveSug(){
  const box=document.getElementById("edSuggest");
  if(!box)return;
  const items=box.querySelectorAll(".sug-item");
  for(let i=0;i<items.length;i++)items[i].classList.toggle("active",i===activeSugIdx);
  if(items[activeSugIdx])try{items[activeSugIdx].scrollIntoView({block:"nearest"});}catch(e){}
}

function showPreviewHTML(html){
  const iframe=document.getElementById("edPreview");
  const doc=iframe.contentDocument||iframe.contentWindow.document;
  doc.open();doc.write(html);doc.close();
}
function showOutputText(text,isError){
  const color=isError?"#ff6b6b":"#d4d4d4",safe=escapeHTML(text);
  showPreviewHTML(`<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><style>body{font-family:Tahoma,sans-serif;padding:16px;background:#1e1e1e;color:${color};margin:0}pre{white-space:pre-wrap;word-break:break-word;font-family:'Courier New',Consolas,monospace;font-size:14px;line-height:1.9;direction:ltr;text-align:left;margin:0;color:${color}}</style></head><body><pre>${safe}</pre></body></html>`);
}

async function runPython(code){
  const pyodide=await ensurePyodide();
  pyodide.globals.set("__user_code__",code);
  await pyodide.runPythonAsync(`
import sys, io, traceback
_stdout_buf = io.StringIO()
_stderr_buf = io.StringIO()
_old_out, _old_err = sys.stdout, sys.stderr
sys.stdout, sys.stderr = _stdout_buf, _stderr_buf
_err_text = ""
try:
    exec(__user_code__, {'__name__': '__main__'})
except SystemExit:
    pass
except BaseException:
    _err_text = traceback.format_exc()
finally:
    sys.stdout, sys.stderr = _old_out, _old_err
`);
  const out=pyodide.runPython("_stdout_buf.getvalue()")||"";
  const err=pyodide.runPython("_stderr_buf.getvalue()")||"";
  const caught=pyodide.runPython("_err_text")||"";
  let result=out+err;
  if(caught)result+=(result?"\n\n":"")+"❌ خطای پایتون:\n"+caught;
  return result||"(بدون خروجی)";
}

async function runSQL(code){
  const SQL=await ensureSqlJs();
  const db=new SQL.Database();
  try{
    const results=db.exec(code);
    if(!results||!results.length)return "✓ اجرا شد (بدون خروجی)";
    let out="";
    for(const r of results){
      out+=r.columns.join(" | ")+"\n";
      out+="─".repeat(Math.max(20,r.columns.join(" | ").length))+"\n";
      for(const row of r.values)out+=row.map(v=>v===null?"NULL":v).join(" | ")+"\n";
      out+="\n";
    }
    return out.trim();
  }finally{try{db.close();}catch(e){}}
}

async function runWithAI(code,langLabel){
  // پرامپت خیلی کوتاه برای پاسخ سریع‌تر
  const p=`اجرای ${langLabel}. فقط خروجی:\n${code}`;
  const d=await callAI({messages:[{role:"user",content:p}],temperature:0,max_tokens:300,request_type:"run_code"});
  const txt=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
  return txt||"(بدون خروجی)";
}

async function runCode(){
  const id=currentEditorLang,cfg=EDITOR_CONFIGS[id];
  if(!cfg)return;
  const code=document.getElementById("edCode").value;
  editorState[id]=code;
  hideSuggest();
  document.getElementById("edOutput").classList.remove("hide");
  const runBtn=document.getElementById("edRunBtn");
  if(cfg.exec==="iframe"){showPreviewHTML(code);return;}
  // پیام بارگذاری هوشمند
  if(cfg.exec==="pyodide"&&!pyodideReady)showOutputText("⏳ آماده‌سازی موتور پایتون (فقط بار اول)...",false);
  else if(cfg.exec==="sqljs"&&!sqlReady)showOutputText("⏳ آماده‌سازی موتور SQL (فقط بار اول)...",false);
  else showOutputText("⏳ در حال اجرا...",false);
  runBtn.disabled=true;
  const oldTxt=runBtn.textContent;
  runBtn.textContent="⏳";
  try{
    let output="";
    if(cfg.exec==="pyodide")output=await runPython(code);
    else if(cfg.exec==="sqljs")output=await runSQL(code);
    else if(cfg.exec==="ai")output=await runWithAI(code,cfg.label);
    showOutputText(output,false);
  }catch(e){
    let msg="❌ خطا: "+(e.message||e);
    if(e.isRateLimit)msg="⚠️ تعداد درخواست‌ها زیاد است. "+(e.remaining_minutes?e.remaining_minutes+" دقیقه دیگر امتحان کنید.":"");
    showOutputText(msg,true);
  }finally{
    runBtn.disabled=false;
    runBtn.textContent=oldTxt;
  }
}

async function aiHelp(){
  const input=document.getElementById("edAiInput"),btn=document.getElementById("edAiBtn");
  const prompt=input.value.trim();
  if(!prompt)return;
  const id=currentEditorLang,cfg=EDITOR_CONFIGS[id];
  if(!cfg)return;
  const currentCode=document.getElementById("edCode").value;
  input.disabled=true;btn.disabled=true;
  const oldTxt=btn.textContent;
  btn.textContent="...";
  hideSuggest();
  const p=`دستیار ${cfg.label}. فقط کد آماده. بدون توضیح.\n\nدرخواست: ${prompt}\n\nکد فعلی:\n${currentCode}`;
  try{
    const d=await callAI({messages:[{role:"user",content:p}],temperature:0.3,max_tokens:2500,request_type:"editor_ai"});
    let txt=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content||"").trim();
    txt=txt.replace(/^```[a-zA-Z0-9+#-]*\s*/i,"").replace(/```\s*$/,"").trim();
    if(!txt)throw new Error("پاسخی نیامد");
    document.getElementById("edCode").value=txt;
    editorState[id]=txt;
    input.value="";
    if(cfg.exec==="iframe")runCode();
    else{
      document.getElementById("edOutput").classList.remove("hide");
      showOutputText("✓ کد تولید شد. برای مشاهده خروجی، روی دکمه «▶ اجرا» بزنید.",false);
    }
  }catch(e){
    if(e.isRateLimit)alert("⚠️ تعداد درخواست‌ها زیاد است. "+(e.remaining_minutes?e.remaining_minutes+" دقیقه دیگر امتحان کنید.":""));
    else alert("❌ "+e.message);
  }finally{
    input.disabled=false;btn.disabled=false;btn.textContent=oldTxt;
  }
}
