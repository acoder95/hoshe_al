const cfg = CONFIG[LANG] || CONFIG.html;
const ta = document.getElementById('edCode');
const hl = document.getElementById('edHighlight');

ta.value = cfg.starter;

let WORD_LIST = null;
function getWordList() {
    if (WORD_LIST) return WORD_LIST;
    WORD_LIST = [];
    const add = (arr, type, icon) => {
        if (arr) arr.forEach(w => WORD_LIST.push({ word: w, type, icon }));
    };
    add(cfg.tags, 'tag', '<>');
    add(cfg.attrs, 'attr', '=');
    add(cfg.types, 'type', '"');
    add(cfg.kw, 'kw', '{}');
    return WORD_LIST;
}

// ══════════ رنگ‌آمیزی ══════════
let hTimer = null;
function updateHighlight() {
    if (hTimer) clearTimeout(hTimer);
    hTimer = setTimeout(() => {
        let txt = ta.value;
        if (txt.endsWith('\n')) txt += ' ';
        let html = txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        
        const strs = [];
        html = html.replace(/(["'])(.*?)\1/g, m => {
            const id = `__S${strs.length}__`;
            strs.push(`<span class="token-string">${m}</span>`);
            return id;
        });
        
        const commentRegex = (LANG === 'py' || LANG === 'php' || LANG === 'git') ? /(\/\/.*|#.*)/g : /(\/\/.*)/g;
        html = html.replace(commentRegex, '<span class="token-comment">$1</span>');
        
        const allKw = [...(cfg.tags||[]), ...(cfg.attrs||[]), ...(cfg.types||[]), ...(cfg.kw||[])];
        if (allKw.length > 0) {
            try {
                const kwRegex = new RegExp(`\\b(${allKw.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})\\b`, 'gi');
                html = html.replace(kwRegex, '<span class="token-keyword">$1</span>');
            } catch(e) {}
        }
        
        html = html.replace(/\b(\d+)\b/g, '<span class="token-number">$1</span>');
        html = html.replace(/__S(\d+)__/g, (m,i) => strs[+i]);
        
        hl.innerHTML = html;
        hl.scrollTop = ta.scrollTop;
        hl.scrollLeft = ta.scrollLeft;
    }, 20);
}

ta.addEventListener('scroll', () => {
    hl.scrollTop = ta.scrollTop;
    hl.scrollLeft = ta.scrollLeft;
});

// ══════════ پیشنهاد کد ══════════
let acIdx = 0, acMatches = [], acStart = 0;

function showAuto() {
    const pos = ta.selectionStart;
    const val = ta.value;
    const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
    const lineText = val.substring(lineStart, pos);
    const m = lineText.match(/([a-zA-Z_]\w*)$/);
    if (!m || m[0].length < 1) { hideAuto(); return; }
    
    const word = m[0].toLowerCase();
    const all = getWordList();
    acMatches = all.filter(item => 
        item.word.toLowerCase().startsWith(word) && 
        item.word.toLowerCase() !== word
    ).slice(0, 30);
    
    if (acMatches.length === 0) { hideAuto(); return; }
    
    acStart = pos - m[0].length;
    acIdx = 0;
    
    acBox.innerHTML = acMatches.map((item, i) => `
        <div class="ac-item ${i===0?'active':''}" data-i="${i}">
            <span class="icon">${item.icon}</span>
            <span class="word">${item.word}</span>
            <span class="type-label">${item.type}</span>
        </div>
    `).join('');
    acBox.style.display = 'block';
    
    acBox.querySelectorAll('.ac-item').forEach(el => {
        el.onclick = () => insertAuto(acMatches[+el.dataset.i]);
    });
}

function hideAuto() { acBox.style.display = 'none'; acMatches = []; }

function insertAuto(item) {
    const { word, type } = item;
    const pos = ta.selectionStart;
    const val = ta.value;
    const before = val.substring(0, acStart);
    const after = val.substring(pos);
    
    const lastLt = before.lastIndexOf('<');
    const lastGt = before.lastIndexOf('>');
    const inTag = lastLt > lastGt;
    const insideQuotes = (before.split('"').length - 1) % 2 === 1;
    
    let insert, cursorPos;
    if (type === 'tag') {
        if (inTag) { insert = `${word}></${word}>`; cursorPos = word.length + 1; }
        else { insert = `<${word}></${word}>`; cursorPos = word.length + 2; }
    } else if (type === 'attr' && inTag && !insideQuotes) {
        insert = `${word}=""`; cursorPos = word.length + 2;
    } else if (type === 'type' && insideQuotes) {
        insert = `${word}"`; cursorPos = word.length + 1;
    } else {
        insert = word; cursorPos = word.length;
    }
    
    ta.value = before + insert + after;
    ta.selectionStart = ta.selectionEnd = acStart + cursorPos;
    hideAuto(); updateHighlight(); ta.focus();
}

ta.addEventListener('input', () => { updateHighlight(); showAuto(); });

ta.addEventListener('keydown', (e) => {
    if (acBox.style.display === 'block') {
        const items = acBox.querySelectorAll('.ac-item');
        if (e.key === 'ArrowDown') { e.preventDefault(); acIdx = Math.min(acIdx+1, items.length-1); refreshActive(items); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); acIdx = Math.max(acIdx-1, 0); refreshActive(items); return; }
        if (e.key === 'Enter' || e.key === 'Tab') {
            if (acMatches[acIdx]) { e.preventDefault(); insertAuto(acMatches[acIdx]); return; }
        }
        if (e.key === 'Escape') { hideAuto(); return; }
    }
    
    if (e.key === 'Enter') {
        e.preventDefault();
        const pos = ta.selectionStart;
        const val = ta.value;
        const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
        const line = val.substring(lineStart, pos);
        const ind = (line.match(/^(\s*)/) || ['',''])[1];
        const trim = line.trim();
        let newInd = ind;
        
        if (/[{[(]$/.test(trim) || (trim.endsWith(':') && !trim.startsWith('#')) ||
            (/^<[a-zA-Z][^>]*>$/.test(trim) && !trim.endsWith('/>') && !/^<\//.test(trim))) {
            newInd += '    ';
        } else if (/^[}\])]/.test(trim) || /^<\//.test(trim)) {
            newInd = ind.length >= 4 ? ind.substring(0, ind.length-4) : '';
        }
        
        ta.value = val.substring(0, pos) + '\n' + newInd + val.substring(pos);
        ta.selectionStart = ta.selectionEnd = pos + 1 + newInd.length;
        updateHighlight();
        return;
    }
    
    if (e.key === 'Tab' && acBox.style.display !== 'block') {
        e.preventDefault();
        const pos = ta.selectionStart;
        ta.value = ta.value.substring(0, pos) + '    ' + ta.value.substring(pos);
        ta.selectionStart = ta.selectionEnd = pos + 4;
        updateHighlight();
    }
});

function refreshActive(items) {
    items.forEach((el,i) => el.classList.toggle('active', i === acIdx));
    if (items[acIdx]) items[acIdx].scrollIntoView({block:'nearest'});
}

document.addEventListener('click', (e) => {
    if (!acBox.contains(e.target) && e.target !== ta) hideAuto();
});

// ══════════ اجرا ══════════
let pyodideInstance = null;

async function runCode() {
    const out = document.getElementById('edOut');
    const outText = document.getElementById('edOutText');
    const iframe = document.getElementById('edPreview');
    const runBtn = document.getElementById('runBtn');
    const code = ta.value;
    
    out.style.display = 'flex';
    outText.style.display = 'block';
    iframe.style.display = 'none';
    outText.textContent = 'در حال پردازش...';
    runBtn.disabled = true;
    
    try {
        // ─── HTML ───
        if (cfg.exec === 'html') {
            outText.style.display = 'none';
            iframe.style.display = 'block';
            iframe.srcdoc = code;
            return;
        }
        
        // ─── CSS ───
        if (cfg.exec === 'css') {
            outText.style.display = 'none';
            iframe.style.display = 'block';
            iframe.srcdoc = `<!DOCTYPE html><html><head><style>${code}</style></head><body><h1>Test Heading</h1><h2>Sub Heading</h2><p>Paragraph text</p><button>Button</button><a href="#">Link</a><div class="box">Box</div></body></html>`;
            return;
        }
        
        // ─── JavaScript ───
        if (cfg.exec === 'js') {
            let logs = [];
            const orig = console.log;
            const origErr = console.error;
            console.log = (...a) => logs.push(a.map(x=>typeof x==='object'?JSON.stringify(x):String(x)).join(' '));
            console.error = (...a) => logs.push('❌ ' + a.map(x=>String(x)).join(' '));
            try { eval(code); }
            catch(e) { logs.push('❌ Error: ' + e.message); }
            finally { console.log = orig; console.error = origErr; }
            outText.textContent = logs.join('\n') || '(بدون خروجی)';
            return;
        }
        
        // ─── Python (اصلاح شده برای جلوگیری از exit(1)) ───
        if (cfg.exec === 'py') {
            // بارگذاری Pyodide فقط یک بار
            if (!pyodideInstance) {
                if (!window.loadPyodide) {
                    outText.textContent = '⏳ بارگذاری موتور پایتون (فقط بار اول، حدود ۱۵ ثانیه)...';
                    await new Promise((res, rej) => {
                        const s = document.createElement('script');
                        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js';
                        s.onload = res;
                        s.onerror = () => rej(new Error('بارگذاری پایتون ناموفق بود'));
                        document.head.appendChild(s);
                    });
                }
                outText.textContent = '⏳ راه‌اندازی پایتون...';
                pyodideInstance = await loadPyodide();
            }
            
            const py = pyodideInstance;
            outText.textContent = '⏳ در حال اجرا...';
            
            // کد کاربر رو به عنوان متغیر گلوبال ست می‌کنیم
            py.globals.set('__user_code__', code);
            
            // همه چیز داخل پایتون اجرا می‌شه تا هر خطایی (از جمله SystemExit) گرفته بشه
            await py.runPythonAsync(`
import sys, io, traceback

# سطل خروجی
_stdout_buf = io.StringIO()
_stderr_buf = io.StringIO()
_old_stdout, _old_stderr = sys.stdout, sys.stderr
sys.stdout, sys.stderr = _stdout_buf, _stderr_buf

# گرفتن sys.exit
class _CaughtExit(BaseException):
    def __init__(self, code=0):
        self.code = code

def _new_exit(code=0):
    raise _CaughtExit(code)

sys.exit = _new_exit

# گرفتن exit و quit (builtin)
import builtins
builtins.exit = _new_exit
builtins.quit = _new_exit

# اجرا با try/except کامل
_err_text = ""
try:
    _code = __user_code__
    exec(compile(_code, "<user>", "exec"), {'__name__': '__main__'})
except _CaughtExit as e:
    _err_text = "SystemExit(" + str(e.code) + ") - برنامه با exit() بسته شد"
except SystemExit as e:
    _err_text = "SystemExit(" + str(e.code) + ") - برنامه با exit() بسته شد"
except BaseException:
    _err_text = traceback.format_exc()
finally:
    sys.stdout, sys.stderr = _old_stdout, _old_stderr
`);
            
            const stdout = py.runPython('_stdout_buf.getvalue()');
            const stderr = py.runPython('_stderr_buf.getvalue()');
            const errText = py.runPython('_err_text');
            
            let finalOutput = stdout + stderr;
            if (errText) {
                finalOutput = (finalOutput ? finalOutput + '\n\n' : '') + '❌ ' + errText;
            }
            outText.textContent = finalOutput || '(بدون خروجی)';
            return;
        }
        
        // ─── زبان‌هایی که در مرورگر اجرا نمی‌شن ───
        if (cfg.exec === 'ai') {
            outText.textContent = '⏳ در حال شبیه‌سازی خروجی با هوش مصنوعی...';
            
            const prompt = `این کد ${cfg.label} را اجرا کن و فقط و فقط خروجی خام آن را بنویس (بدون هیچ توضیح اضافه، بدون markdown، بدون بلوک کد). اگر خطایی دارد، متن خطا را بنویس:\n\n${code}`;
            
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    messages: [{ role: 'user', content: prompt }],
                    temperature: 0,
                    max_tokens: 800,
                    model: 'gpt-4o-mini'
                })
            });
            
            if (res.status === 429) throw new Error('محدودیت ۲۰ درخواست در ۱۲ ساعت');
            if (!res.ok) throw new Error('خطای سرور: ' + res.status);
            
            const data = await res.json();
            const output = data.choices?.[0]?.message?.content || '(بدون خروجی)';
            outText.textContent = output.trim();
            return;
        }
        
    } catch(err) {
        outText.textContent = '❌ خطا: ' + (err.message || String(err));
    } finally {
        runBtn.disabled = false;
    }
}

function closeOut() {
    document.getElementById('edOut').style.display = 'none';
}

updateHighlight();
</script>
